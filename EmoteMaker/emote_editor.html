<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rec Room Emote Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
#toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #16213e; border-bottom: 1px solid #0f3460; flex-wrap: wrap; }
#toolbar button, #toolbar select { padding: 6px 12px; border: none; border-radius: 4px; background: #0f3460; color: #eee; cursor: pointer; font-size: 13px; }
#toolbar button:hover { background: #1a5276; }
#toolbar button.active { background: #e94560; }
#toolbar label { font-size: 12px; color: #aaa; }
#main { display: flex; flex: 1; overflow: hidden; }
#viewport { flex: 1; position: relative; }
#viewport canvas { display: block; }
#sidebar { width: 320px; background: #16213e; border-left: 1px solid #0f3460; overflow-y: auto; padding: 12px; }
#sidebar h3 { font-size: 14px; margin-bottom: 8px; color: #e94560; }
.prop-group { margin-bottom: 12px; padding: 8px; background: #1a1a2e; border-radius: 6px; }
.prop-group h4 { font-size: 12px; margin-bottom: 6px; color: #4fc3f7; }
.prop-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.prop-row label { width: 20px; font-size: 11px; color: #888; }
.prop-row input[type="number"] { width: 70px; padding: 3px 5px; border: 1px solid #333; border-radius: 3px; background: #0d1b2a; color: #eee; font-size: 12px; }
.prop-row input[type="range"] { flex: 1; }
#timeline { height: 140px; background: #16213e; border-top: 1px solid #0f3460; padding: 8px 12px; display: flex; flex-direction: column; }
#timeline-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#timeline-header span { font-size: 12px; color: #aaa; }
#timeline-track { position: relative; flex: 1; background: #0d1b2a; border-radius: 4px; overflow: hidden; cursor: pointer; }
#timeline-track .keyframe { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; background: #e94560; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
#timeline-track .keyframe.selected { background: #4fc3f7; box-shadow: 0 0 8px #4fc3f7; }
#timeline-track .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffd700; pointer-events: none; }
#time-display { font-size: 12px; color: #ffd700; min-width: 60px; }
.btn-sm { padding: 4px 8px !important; font-size: 11px !important; }
#export-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
#export-modal.show { display: flex; }
#export-modal .modal-content { background: #16213e; padding: 20px; border-radius: 8px; width: 80%; max-height: 80vh; display: flex; flex-direction: column; }
#export-modal textarea { flex: 1; min-height: 200px; background: #0d1b2a; color: #4fc3f7; border: 1px solid #333; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 11px; resize: vertical; }
#export-modal .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
#import-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
#import-modal.show { display: flex; }
#import-modal .modal-content { background: #16213e; padding: 20px; border-radius: 8px; width: 80%; max-height: 80vh; display: flex; flex-direction: column; }
#import-modal textarea { flex: 1; min-height: 200px; background: #0d1b2a; color: #4fc3f7; border: 1px solid #333; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 11px; resize: vertical; }
#import-modal .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btn-add-kf" title="Add keyframe at current time">+ Keyframe</button>
  <button id="btn-del-kf" title="Delete selected keyframe">Del Keyframe</button>
  <span style="color:#555">|</span>
  <button id="btn-play">▶ Play</button>
  <button id="btn-stop">⏹ Stop</button>
  <label>Mode:</label>
  <select id="play-mode">
    <option value="loop">Loop</option>
    <option value="pingpong">PingPong</option>
    <option value="single">Single</option>
  </select>
  <span style="color:#555">|</span>
  <label>Duration:</label>
  <input type="number" id="duration" value="10" min="1" max="60" step="0.5" style="width:50px;padding:3px;background:#0d1b2a;color:#eee;border:1px solid #333;border-radius:3px;">
  <span style="color:#555">|</span>
  <button id="btn-export">Export JSON</button>
  <button id="btn-import">Import JSON</button>
  <span style="color:#555">|</span>
  <button id="btn-export-cfg">Export .cfg</button>
  <button id="btn-import-cfg">Import .cfg</button>
</div>
<div id="main">
  <div id="viewport"></div>
  <div id="sidebar">
    <h3>Body Part Properties</h3>
    <div class="prop-group">
      <h4>Keyframe Time (s)</h4>
      <div class="prop-row"><label>T</label><input type="number" id="kf-time" step="0.1" min="0" value="0"></div>
    </div>
    <div class="prop-group">
      <h4>Head Position</h4>
      <div class="prop-row"><label>X</label><input type="number" id="hp-x" step="0.1" value="0"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="hp-y" step="0.1" value="0.5"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="hp-z" step="0.1" value="0"></div>
    </div>
    <div class="prop-group">
      <h4>Head Rotation (deg)</h4>
      <div class="prop-row"><label>X</label><input type="number" id="hr-x" step="1" value="0"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="hr-y" step="1" value="0"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="hr-z" step="1" value="0"></div>
    </div>
    <div class="prop-group">
      <h4>Left Hand Position</h4>
      <div class="prop-row"><label>X</label><input type="number" id="lhp-x" step="0.1" value="-0.3"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="lhp-y" step="0.1" value="0.5"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="lhp-z" step="0.1" value="0.2"></div>
    </div>
    <div class="prop-group">
      <h4>Left Hand Rotation (deg)</h4>
      <div class="prop-row"><label>X</label><input type="number" id="lhr-x" step="1" value="0"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="lhr-y" step="1" value="0"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="lhr-z" step="1" value="0"></div>
    </div>
    <div class="prop-group">
      <h4>Right Hand Position</h4>
      <div class="prop-row"><label>X</label><input type="number" id="rhp-x" step="0.1" value="0.3"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="rhp-y" step="0.1" value="0.9"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="rhp-z" step="0.1" value="0.3"></div>
    </div>
    <div class="prop-group">
      <h4>Right Hand Rotation (deg)</h4>
      <div class="prop-row"><label>X</label><input type="number" id="rhr-x" step="1" value="0"></div>
      <div class="prop-row"><label>Y</label><input type="number" id="rhr-y" step="1" value="0"></div>
      <div class="prop-row"><label>Z</label><input type="number" id="rhr-z" step="1" value="0"></div>
    </div>
  </div>
</div>
<div id="timeline">
  <div id="timeline-header">
    <span>Timeline</span>
    <input type="number" id="time-display" value="0.00" step="0.1" min="0" style="width:70px;padding:3px 5px;background:#0d1b2a;color:#ffd700;border:1px solid #333;border-radius:3px;font-size:12px;">
    <button class="btn-sm" id="btn-prev-kf">◀</button>
    <button class="btn-sm" id="btn-next-kf">▶</button>
  </div>
  <div id="timeline-track">
    <div class="playhead" id="playhead"></div>
  </div>
</div>
<div id="export-modal">
  <div class="modal-content">
    <h3 style="margin-bottom:12px;">JSON Output</h3>
    <textarea id="json-output" readonly></textarea>
    <div class="modal-btns">
      <button onclick="copyJSON()">Copy</button>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>
</div>
<div id="import-modal">
  <div class="modal-content">
    <h3 style="margin-bottom:12px;">Paste Emote JSON</h3>
    <textarea id="json-input" placeholder='[{"time":0.0,"headPos":[0,.5,0],...}]'></textarea>
    <div class="modal-btns">
      <button onclick="loadPastedJSON()">Load</button>
      <button onclick="document.getElementById('file-input').click()">Or Choose File…</button>
      <button onclick="closeImportModal()">Cancel</button>
    </div>
  </div>
</div>
<input type="file" id="file-input" accept=".json" style="display:none">
<input type="file" id="cfg-file-input" accept=".cfg" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== STATE =====
let keyframes = [
  { time: 0, headPos: [0,0.5,0], headRot: [0,0,0], leftHandPos: [-0.3,0,0.2], leftHandRot: [0,0,0], rightHandPos: [0.3,0,0.2], rightHandRot: [0,0,0] },
  { time: 10, headPos: [0,0.5,0], headRot: [0,0,0], leftHandPos: [-0.3,0,0.2], leftHandRot: [0,0,0], rightHandPos: [0.3,0,0.2], rightHandRot: [0,0,0] }
];
let selectedKF = 0;
let currentTime = 0;
let playing = false;
let playDirection = 1;
let duration = 10;

// ===== NEGATION FLAGS (editor preview only, export unaffected) =====
// Set to true to negate that axis in the preview renderer.
const NEG = {
  headPosX: true, headPosY: false, headPosZ: false,
  headRotX: false, headRotY: true,  headRotZ: true,
  leftHandPosX: true,  leftHandPosY: false, leftHandPosZ: false,
  leftHandRotX: false, leftHandRotY: true,  leftHandRotZ: true,
  rightHandPosX: true,  rightHandPosY: false, rightHandPosZ: false,
  rightHandRotX: false, rightHandRotY: true,  rightHandRotZ: true,
};
function neg(v, flag) { return flag ? -v : v; }



// ===== THREE.JS SETUP =====
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.set(0, 1.5, 3);
camera.lookAt(0, 0.7, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewport.appendChild(renderer.domElement);

// Lights
const amb = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(2, 4, 3);
scene.add(dir);

// Grid
const grid = new THREE.GridHelper(4, 20, 0x333366, 0x222244);
scene.add(grid);

// Body parts
function createPart(color, size) {
  const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mat = new THREE.MeshPhongMaterial({ color });
  return new THREE.Mesh(geo, mat);
}
const headMesh = createPart(0xffcc00, [0.3, 0.3, 0.3]);

// Add "front" label to the front face of the head
(function() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'transparent';
  ctx.fillRect(0, 0, 128, 64);
  ctx.font = 'bold 32px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('front', 64, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const labelMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false });
  const labelGeo = new THREE.PlaneGeometry(0.25, 0.12);
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.set(0, 0, 0.151); // front of head
  headMesh.add(label);
})();

function createHand(color, isLeft = false, mirror = false) {
  const group = new THREE.Group();
  const mat = () => new THREE.MeshPhongMaterial({ color, side: THREE.DoubleSide });
  // Palm
  const palm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.05), mat());
  group.add(palm);
  // Fingers (slightly narrower, extending up)
  const fingers = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.08, 0.04), mat());
  fingers.position.set(0, 0.12, 0);
  group.add(fingers);
  // Thumb
  const thumb = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.07, 0.04), mat());
  const thumbX = (isLeft ? -0.08 : 0.08) * (mirror ? -1 : 1);
  thumb.position.set(thumbX, -0.02 * (mirror ? -1 : 1), 0);
  thumb.rotation.z = -0.4 * (mirror ? -1 : 1);
  group.add(thumb);
  return group;
}

const leftHandMesh = createHand(0x4fc3f7, false, true); // mirrored on X and Y
const rightHandMesh = createHand(0xe94560, true);
leftHandMesh.rotation.set(Math.PI, -Math.PI / 2, Math.PI / 2);
rightHandMesh.rotation.set(Math.PI, -Math.PI / 2, Math.PI / 2);

// Wrapper groups: animation drives these, inner mesh keeps its base rotation
const leftHandWrapper = new THREE.Group();
leftHandWrapper.add(leftHandMesh);
const rightHandWrapper = new THREE.Group();
rightHandWrapper.add(rightHandMesh);
scene.add(headMesh, leftHandWrapper, rightHandWrapper);

// Body reference (torso)
const torsoGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.6, 8);
const torsoMat = new THREE.MeshPhongMaterial({ color: 0x555577, transparent: true, opacity: 0.4 });
const torso = new THREE.Mesh(torsoGeo, torsoMat);
torso.position.set(0, 0.5, 0);
scene.add(torso);

// ===== ORBIT CONTROLS (manual) =====
let camTheta = 0, camPhi = Math.PI/4, camDist = 3;
let camTarget = new THREE.Vector3(0, 0.7, 0);
let dragging = false, lastMouse = {x:0,y:0};
let rightDrag = false;

function updateCamera() {
  camera.position.x = camTarget.x + camDist * Math.sin(camPhi) * Math.sin(camTheta);
  camera.position.y = camTarget.y + camDist * Math.cos(camPhi);
  camera.position.z = camTarget.z + camDist * Math.sin(camPhi) * Math.cos(camTheta);
  camera.lookAt(camTarget);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) { dragging = true; }
  if (e.button === 2) { rightDrag = true; }
  lastMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mouseup', () => { dragging = false; rightDrag = false; });
window.addEventListener('mousemove', e => {
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  lastMouse = { x: e.clientX, y: e.clientY };
  if (dragging) {
    camTheta -= dx * 0.01;
    camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.01));
    updateCamera();
  }
  if (rightDrag) {
    const right = new THREE.Vector3();
    camera.getWorldDirection(right);
    right.cross(camera.up).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    camTarget.add(right.multiplyScalar(-dx * 0.003));
    camTarget.add(up.multiplyScalar(dy * 0.003));
    updateCamera();
  }
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.max(0.5, Math.min(20, camDist + e.deltaY * 0.003));
  updateCamera();
});

// ===== RESIZE =====
function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

// ===== EULER TO QUATERNION =====
function eulerToQuat(x, y, z) {
  const cx = Math.cos(x * Math.PI / 360), sx = Math.sin(x * Math.PI / 360);
  const cy = Math.cos(y * Math.PI / 360), sy = Math.sin(y * Math.PI / 360);
  const cz = Math.cos(z * Math.PI / 360), sz = Math.sin(z * Math.PI / 360);
  return [
    sx*cy*cz - cx*sy*sz,
    cx*sy*cz + sx*cy*sz,
    cx*cy*sz - sx*sy*cz,
    cx*cy*cz + sx*sy*sz
  ];
}

// ===== INTERPOLATION =====
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpArr(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }
function slerpQuat(a, b, t) {
  let dot = a.reduce((s, v, i) => s + v * b[i], 0);
  if (dot < 0) { b = b.map(v => -v); dot = -dot; }
  if (dot > 0.9995) return lerpArr(a, b, t);
  const theta = Math.acos(dot);
  const sinT = Math.sin(theta);
  const wa = Math.sin((1 - t) * theta) / sinT;
  const wb = Math.sin(t * theta) / sinT;
  return a.map((v, i) => v * wa + b[i] * wb);
}

function getInterpolated(time) {
  if (keyframes.length === 0) return null;
  if (keyframes.length === 1) {
    const kf = keyframes[0];
    return {
      headPos: kf.headPos,
      headQuat: eulerToQuat(neg(kf.headRot[0], NEG.headRotX), neg(kf.headRot[1], NEG.headRotY), neg(kf.headRot[2], NEG.headRotZ)),
      leftHandPos: kf.leftHandPos,
      leftHandQuat: eulerToQuat(neg(kf.leftHandRot[0], NEG.leftHandRotX), neg(kf.leftHandRot[1], NEG.leftHandRotY), neg(kf.leftHandRot[2], NEG.leftHandRotZ)),
      rightHandPos: kf.rightHandPos,
      rightHandQuat: eulerToQuat(neg(kf.rightHandRot[0], NEG.rightHandRotX), neg(kf.rightHandRot[1], NEG.rightHandRotY), neg(kf.rightHandRot[2], NEG.rightHandRotZ)),
    };
  }
  let prev = keyframes[0], next = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (time >= keyframes[i].time && time <= keyframes[i + 1].time) {
      prev = keyframes[i]; next = keyframes[i + 1]; break;
    }
  }
  if (time <= keyframes[0].time) {
    const kf = keyframes[0];
    return {
      headPos: kf.headPos,
      headQuat: eulerToQuat(neg(kf.headRot[0], NEG.headRotX), neg(kf.headRot[1], NEG.headRotY), neg(kf.headRot[2], NEG.headRotZ)),
      leftHandPos: kf.leftHandPos,
      leftHandQuat: eulerToQuat(neg(kf.leftHandRot[0], NEG.leftHandRotX), neg(kf.leftHandRot[1], NEG.leftHandRotY), neg(kf.leftHandRot[2], NEG.leftHandRotZ)),
      rightHandPos: kf.rightHandPos,
      rightHandQuat: eulerToQuat(neg(kf.rightHandRot[0], NEG.rightHandRotX), neg(kf.rightHandRot[1], NEG.rightHandRotY), neg(kf.rightHandRot[2], NEG.rightHandRotZ)),
    };
  }
  if (time >= keyframes[keyframes.length-1].time) {
    const kf = keyframes[keyframes.length-1];
    return {
      headPos: kf.headPos,
      headQuat: eulerToQuat(neg(kf.headRot[0], NEG.headRotX), neg(kf.headRot[1], NEG.headRotY), neg(kf.headRot[2], NEG.headRotZ)),
      leftHandPos: kf.leftHandPos,
      leftHandQuat: eulerToQuat(neg(kf.leftHandRot[0], NEG.leftHandRotX), neg(kf.leftHandRot[1], NEG.leftHandRotY), neg(kf.leftHandRot[2], NEG.leftHandRotZ)),
      rightHandPos: kf.rightHandPos,
      rightHandQuat: eulerToQuat(neg(kf.rightHandRot[0], NEG.rightHandRotX), neg(kf.rightHandRot[1], NEG.rightHandRotY), neg(kf.rightHandRot[2], NEG.rightHandRotZ)),
    };
  }
  const t = (time - prev.time) / (next.time - prev.time || 1);
  const pq = eulerToQuat(neg(prev.headRot[0], NEG.headRotX), neg(prev.headRot[1], NEG.headRotY), neg(prev.headRot[2], NEG.headRotZ)), nq = eulerToQuat(neg(next.headRot[0], NEG.headRotX), neg(next.headRot[1], NEG.headRotY), neg(next.headRot[2], NEG.headRotZ));
  const lq = eulerToQuat(neg(prev.leftHandRot[0], NEG.leftHandRotX), neg(prev.leftHandRot[1], NEG.leftHandRotY), neg(prev.leftHandRot[2], NEG.leftHandRotZ)), nlq = eulerToQuat(neg(next.leftHandRot[0], NEG.leftHandRotX), neg(next.leftHandRot[1], NEG.leftHandRotY), neg(next.leftHandRot[2], NEG.leftHandRotZ));
  const rq = eulerToQuat(neg(prev.rightHandRot[0], NEG.rightHandRotX), neg(prev.rightHandRot[1], NEG.rightHandRotY), neg(prev.rightHandRot[2], NEG.rightHandRotZ)), nrq = eulerToQuat(neg(next.rightHandRot[0], NEG.rightHandRotX), neg(next.rightHandRot[1], NEG.rightHandRotY), neg(next.rightHandRot[2], NEG.rightHandRotZ));
  return {
    headPos: lerpArr(prev.headPos, next.headPos, t),
    headQuat: slerpQuat(pq, nq, t),
    leftHandPos: lerpArr(prev.leftHandPos, next.leftHandPos, t),
    leftHandQuat: slerpQuat(lq, nlq, t),
    rightHandPos: lerpArr(prev.rightHandPos, next.rightHandPos, t),
    rightHandQuat: slerpQuat(rq, nrq, t),
  };
}

// ===== RENDER =====
function updateMeshes() {
  const state = getInterpolated(currentTime);
  if (!state) return;
  headMesh.position.set(neg(state.headPos[0], NEG.headPosX), neg(state.headPos[1], NEG.headPosY), neg(state.headPos[2], NEG.headPosZ));
  headMesh.quaternion.set(...state.headQuat);
  leftHandWrapper.position.set(neg(state.leftHandPos[0], NEG.leftHandPosX), neg(state.leftHandPos[1], NEG.leftHandPosY), neg(state.leftHandPos[2], NEG.leftHandPosZ));
  leftHandWrapper.quaternion.set(...state.leftHandQuat);
  rightHandWrapper.position.set(neg(state.rightHandPos[0], NEG.rightHandPosX), neg(state.rightHandPos[1], NEG.rightHandPosY), neg(state.rightHandPos[2], NEG.rightHandPosZ));
  rightHandWrapper.quaternion.set(...state.rightHandQuat);
}

// ===== TIMELINE =====
const track = document.getElementById('timeline-track');
const playhead = document.getElementById('playhead');

function renderTimeline() {
  track.querySelectorAll('.keyframe').forEach(el => el.remove());
  keyframes.forEach((kf, i) => {
    const el = document.createElement('div');
    el.className = 'keyframe' + (i === selectedKF ? ' selected' : '');
    el.style.left = (kf.time / duration * 100) + '%';
    el.title = `KF ${i}: ${kf.time.toFixed(2)}s`;
    el.addEventListener('click', e => { e.stopPropagation(); selectedKF = i; currentTime = kf.time; loadPropsFromKF(); renderTimeline(); });
    track.appendChild(el);
  });
}

track.addEventListener('click', e => {
  const rect = track.getBoundingClientRect();
  currentTime = Math.max(0, Math.min(duration, (e.clientX - rect.left) / rect.width * duration));
  document.getElementById('time-display').value = currentTime.toFixed(2);
});

// Editable time input - jump to precise time
const timeInput = document.getElementById('time-display');
timeInput.addEventListener('input', () => {
  const val = parseFloat(timeInput.value);
  if (!isNaN(val)) {
    currentTime = Math.max(0, Math.min(duration, val));
  }
});
timeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    timeInput.blur();
  }
});

// ===== SIDEBAR PROPS =====
function loadPropsFromKF() {
  const kf = keyframes[selectedKF];
  if (!kf) return;
  document.getElementById('kf-time').value = kf.time;
  document.getElementById('hp-x').value = kf.headPos[0];
  document.getElementById('hp-y').value = kf.headPos[1];
  document.getElementById('hp-z').value = kf.headPos[2];
  document.getElementById('hr-x').value = kf.headRot[0];
  document.getElementById('hr-y').value = kf.headRot[1];
  document.getElementById('hr-z').value = kf.headRot[2];
  document.getElementById('lhp-x').value = kf.leftHandPos[0];
  document.getElementById('lhp-y').value = kf.leftHandPos[1];
  document.getElementById('lhp-z').value = kf.leftHandPos[2];
  document.getElementById('lhr-x').value = kf.leftHandRot[0];
  document.getElementById('lhr-y').value = kf.leftHandRot[1];
  document.getElementById('lhr-z').value = kf.leftHandRot[2];
  document.getElementById('rhp-x').value = kf.rightHandPos[0];
  document.getElementById('rhp-y').value = kf.rightHandPos[1];
  document.getElementById('rhp-z').value = kf.rightHandPos[2];
  document.getElementById('rhr-x').value = kf.rightHandRot[0];
  document.getElementById('rhr-y').value = kf.rightHandRot[1];
  document.getElementById('rhr-z').value = kf.rightHandRot[2];
}

// Auto-apply on any input change
const propInputs = document.querySelectorAll('#sidebar input[type="number"]');
propInputs.forEach(inp => {
  inp.addEventListener('input', () => {
    const kf = keyframes[selectedKF];
    if (!kf) return;
    const newTime = +document.getElementById('kf-time').value;
    if (newTime !== kf.time) {
      kf.time = newTime;
      keyframes.sort((a, b) => a.time - b.time);
      selectedKF = keyframes.indexOf(kf);
      renderTimeline();
    }
    kf.headPos = [+document.getElementById('hp-x').value, +document.getElementById('hp-y').value, +document.getElementById('hp-z').value];
    kf.headRot = [+document.getElementById('hr-x').value, +document.getElementById('hr-y').value, +document.getElementById('hr-z').value];
    kf.leftHandPos = [+document.getElementById('lhp-x').value, +document.getElementById('lhp-y').value, +document.getElementById('lhp-z').value];
    kf.leftHandRot = [+document.getElementById('lhr-x').value, +document.getElementById('lhr-y').value, +document.getElementById('lhr-z').value];
    kf.rightHandPos = [+document.getElementById('rhp-x').value, +document.getElementById('rhp-y').value, +document.getElementById('rhp-z').value];
    kf.rightHandRot = [+document.getElementById('rhr-x').value, +document.getElementById('rhr-y').value, +document.getElementById('rhr-z').value];
  });
});

// ===== KEYFRAME OPS =====
document.getElementById('btn-add-kf').addEventListener('click', () => {
  const kf = {
    time: currentTime,
    headPos: [0, 0.5, 0], headRot: [0, 0, 0],
    leftHandPos: [-0.3, 0.5, 0.2], leftHandRot: [0, 0, 0],
    rightHandPos: [0.3, 0.9, 0.3], rightHandRot: [0, 0, 0]
  };
  // Copy from interpolated state
  const state = getInterpolated(currentTime);
  if (state) {
    kf.headPos = [...state.headPos];
    kf.headRot = quatToEuler(state.headQuat);
    kf.leftHandPos = [...state.leftHandPos];
    kf.leftHandRot = quatToEuler(state.leftHandQuat);
    kf.rightHandPos = [...state.rightHandPos];
    kf.rightHandRot = quatToEuler(state.rightHandQuat);
  }
  keyframes.push(kf);
  keyframes.sort((a, b) => a.time - b.time);
  selectedKF = keyframes.indexOf(kf);
  loadPropsFromKF();
  renderTimeline();
});

document.getElementById('btn-del-kf').addEventListener('click', () => {
  if (keyframes.length <= 1) return;
  keyframes.splice(selectedKF, 1);
  selectedKF = Math.max(0, selectedKF - 1);
  loadPropsFromKF();
  renderTimeline();
});

document.getElementById('btn-prev-kf').addEventListener('click', () => {
  selectedKF = Math.max(0, selectedKF - 1);
  currentTime = keyframes[selectedKF].time;
  loadPropsFromKF(); renderTimeline();
});
document.getElementById('btn-next-kf').addEventListener('click', () => {
  selectedKF = Math.min(keyframes.length - 1, selectedKF + 1);
  currentTime = keyframes[selectedKF].time;
  loadPropsFromKF(); renderTimeline();
});

// ===== PLAYBACK =====
document.getElementById('btn-play').addEventListener('click', () => { playing = true; });
document.getElementById('btn-stop').addEventListener('click', () => { playing = false; currentTime = 0; });
document.getElementById('duration').addEventListener('change', e => { duration = +e.target.value; renderTimeline(); });

let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (playing) {
    const mode = document.getElementById('play-mode').value;
    currentTime += dt * playDirection;
    if (mode === 'loop') {
      if (currentTime > duration) currentTime = 0;
      if (currentTime < 0) currentTime = duration;
    } else if (mode === 'pingpong') {
      if (currentTime > duration) { currentTime = duration; playDirection = -1; }
      if (currentTime < 0) { currentTime = 0; playDirection = 1; }
    } else {
      if (currentTime > duration) { currentTime = duration; playing = false; }
    }
  }

  playhead.style.left = (currentTime / duration * 100) + '%';
  if (playing || document.activeElement !== document.getElementById('time-display')) {
    document.getElementById('time-display').value = currentTime.toFixed(2);
  }
  updateMeshes();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ===== EXPORT =====
document.getElementById('btn-export').addEventListener('click', () => {
  const sorted = [...keyframes].sort((a, b) => a.time - b.time);
  const data = sorted.map(kf => ({
    time: kf.time,
    headPos: kf.headPos,
    headRot: eulerToQuat(...kf.headRot),
    leftHandPos: kf.leftHandPos,
    leftHandRot: eulerToQuat(...kf.leftHandRot),
    rightHandPos: kf.rightHandPos,
    rightHandRot: eulerToQuat(...kf.rightHandRot)
  }));
  const json = JSON.stringify(data);
  document.getElementById('json-output').value = json;
  document.getElementById('export-modal').classList.add('show');
});

function copyJSON() {
  const ta = document.getElementById('json-output');
  ta.select();
  document.execCommand('copy');
}
function closeModal() {
  document.getElementById('export-modal').classList.remove('show');
}

// ===== IMPORT =====
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('json-input').value = '';
  document.getElementById('import-modal').classList.add('show');
});

// ===== CFG IMPORT =====
document.getElementById('btn-import-cfg').addEventListener('click', () => {
  document.getElementById('cfg-file-input').click();
});

document.getElementById('cfg-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const text = ev.target.result.replace(/\\/g, '');
      const match = text.match(/KeyframesJson\s*=\s*(\[.*\])/);
      if (!match) { alert('Could not find KeyframesJson in .cfg file.'); return; }
      importKeyframes(JSON.parse(match[1]));
    } catch (err) { alert('Invalid CFG/JSON: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ===== CFG EXPORT =====
document.getElementById('btn-export-cfg').addEventListener('click', () => {
  const sorted = [...keyframes].sort((a, b) => a.time - b.time);
  const data = sorted.map(kf => ({
    time: kf.time,
    headPos: kf.headPos,
    headRot: eulerToQuat(...kf.headRot),
    leftHandPos: kf.leftHandPos,
    leftHandRot: eulerToQuat(...kf.leftHandRot),
    rightHandPos: kf.rightHandPos,
    rightHandRot: eulerToQuat(...kf.rightHandRot)
  }));
  const json = JSON.stringify(data);
  const mode = document.getElementById('play-mode').value;
  const modeStr = mode === 'loop' ? 'Loop' : mode === 'pingpong' ? 'PingPong' : 'Single';
  const cfg = `[Emote]\n\n## JSON array of keyframes.\n# Setting type: String\n# Default value:\nKeyframesJson = ${json}\n\n## Playback mode: Loop, PingPong, Single.\n# Setting type: EmotePlaybackMode\n# Default value: Loop\n# Acceptable values: Loop, PingPong, Single\nPlaybackMode = ${modeStr}\n`;
  const blob = new Blob([cfg], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'CustomEmote.cfg';
  a.click();
  URL.revokeObjectURL(url);
});

function loadPastedJSON() {
  const text = document.getElementById('json-input').value.trim().replace(/\\/g, '');
  if (!text) { alert('Paste some JSON first.'); return; }
  try {
    importKeyframes(JSON.parse(text));
    closeImportModal();
  } catch (err) { alert('Invalid JSON: ' + err.message); }
}
function closeImportModal() {
  document.getElementById('import-modal').classList.remove('show');
}

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      importKeyframes(JSON.parse(ev.target.result.replace(/\\/g, '')));
      closeImportModal();
    } catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function importKeyframes(data) {
  keyframes = data.map(kf => ({
    time: kf.time,
    headPos: kf.headPos || [0,0.5,0],
    headRot: quatToEuler(kf.headRot || [0,0,0,1]),
    leftHandPos: kf.leftHandPos || [-0.3,0.5,0.2],
    leftHandRot: quatToEuler(kf.leftHandRot || [0,0,0,1]),
    rightHandPos: kf.rightHandPos || [0.3,0.9,0.3],
    rightHandRot: quatToEuler(kf.rightHandRot || [0,0,0,1])
  }));
  keyframes.sort((a, b) => a.time - b.time);
  duration = keyframes[keyframes.length - 1].time || 10;
  document.getElementById('duration').value = duration;
  selectedKF = 0;
  currentTime = 0;
  loadPropsFromKF();
  renderTimeline();
}

function quatToEuler(q) {
  const [x, y, z, w] = q;
  const sinr = 2 * (w * x + y * z);
  const cosr = 1 - 2 * (x * x + y * y);
  const roll = Math.atan2(sinr, cosr);
  const sinp = 2 * (w * y - z * x);
  const pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);
  const siny = 2 * (w * z + x * y);
  const cosy = 1 - 2 * (y * y + z * z);
  const yaw = Math.atan2(siny, cosy);
  return [+(roll * 180 / Math.PI).toFixed(2), +(pitch * 180 / Math.PI).toFixed(2), +(yaw * 180 / Math.PI).toFixed(2)];
}

// ===== INIT =====
renderTimeline();
loadPropsFromKF();
</script>
